name: live release

# Fails when Kiri's published release files stop having the shape
# kiri-mcp reads, or when the sources disagree on the latest version.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/check-live-release.py"
      - "kirimcp/**"
      - ".github/workflows/live-release.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q rpm
      - run: python tests/check-live-release.py
